<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>and-drawer e2e fixture</title>
    <link rel="stylesheet" href="/src/global/global.css" />
    <script type="module">
      import '/dist/components/all.js';
      import { registerAllIcons } from '/node_modules/@andersseen/icon/dist/index.js';
      registerAllIcons();
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <button id="open-labeled">Open settings drawer</button>
    <and-drawer id="labeled-drawer" label="Settings" placement="right">
      <span slot="header">Settings</span>
      <label>
        Display name
        <input type="text" id="name-input" />
      </label>
      <a href="#" id="learn-more-link">Learn more</a>
      <button type="button" id="save-button">Save</button>
    </and-drawer>

    <button id="open-unlabeled">Open unlabeled drawer</button>
    <and-drawer id="unlabeled-drawer" placement="left">
      <p>No label prop, deliberately — for the accessible-name regression test.</p>
    </and-drawer>

    <script type="module">
      const labeledDrawer = document.getElementById('labeled-drawer');
      const unlabeledDrawer = document.getElementById('unlabeled-drawer');

      document.getElementById('open-labeled').addEventListener('click', () => {
        labeledDrawer.open = true;
      });
      document.getElementById('open-unlabeled').addEventListener('click', () => {
        unlabeledDrawer.open = true;
      });
    </script>
  </body>
</html>
